<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Body -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#45475a" stroke-width="3" />
  
  <!-- Display Screen -->
  <rect x="20" y="20" width="88" height="30" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5" />
  
  <!-- Display Text / Vector Math Glyph -->
  <text x="30" y="41" font-family="monospace" font-size="14" font-weight="bold" fill="#89b4fa">1..10 ➔</text>
  <text x="82" y="41" font-family="monospace" font-size="14" font-weight="bold" fill="#a6e3a1">55</text>
  
  <!-- Keypad Buttons -->
  <g fill="#252538" stroke="#45475a" stroke-width="1">
    <!-- Row 1 -->
    <rect x="22" y="58" width="18" height="18" rx="4" />
    <rect x="44" y="58" width="18" height="18" rx="4" />
    <rect x="66" y="58" width="18" height="18" rx="4" />
    <rect x="88" y="58" width="18" height="18" rx="4" fill="#89b4fa" stroke="#b4befe" />
    
    <!-- Row 2 -->
    <rect x="22" y="80" width="18" height="18" rx="4" />
    <rect x="44" y="80" width="18" height="18" rx="4" />
    <rect x="66" y="80" width="18" height="18" rx="4" />
    <rect x="88" y="80" width="18" height="18" rx="4" fill="#cba6f7" stroke="#f5c2e7" />
    
    <!-- Row 3 -->
    <rect x="22" y="102" width="18" height="18" rx="4" />
    <rect x="44" y="102" width="18" height="18" rx="4" />
    <rect x="66" y="102" width="18" height="18" rx="4" />
    <rect x="88" y="102" width="18" height="18" rx="4" fill="#a6e3a1" stroke="#94e2d5" />
  </g>
  
  <!-- Key Glyphs -->
  <g font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4" text-anchor="middle">
    <text x="31" y="71">7</text>
    <text x="53" y="71">8</text>
    <text x="75" y="71">9</text>
    <text x="97" y="71" fill="#11111b">÷</text>
    
    <text x="31" y="93">4</text>
    <text x="53" y="93">5</text>
    <text x="75" y="93">6</text>
    <text x="97" y="93" fill="#11111b">×</text>
    
    <text x="31" y="115">1</text>
    <text x="53" y="115">2</text>
    <text x="75" y="115">3</text>
    <text x="97" y="115" fill="#11111b">=</text>
  </g>
</svg>
